[package]
name = "ks-esp32c6"
version = "0.1.0"
edition = "2024"

[dependencies]
critical-section = "1.2.0"
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32c6",
  "uart",
  "colors",
  "critical-section",
] }
esp32c6 = "0.25.0"
kyrylscript = { package = "ks-vm", path = "../kyrylscript/workspace/ks-vm", default-features = false }

[profile.release]
opt-level = "s"
lto = true
